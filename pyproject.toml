[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-qa-chatbot"
version = "0.2.0"
description = "RAG-powered Python knowledge-base Q&A chatbot with Gemini LLM"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "google-generativeai>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]
reranker = ["sentence-transformers>=3.0"]

[project.scripts]
python-qa-ingest = "qa_chatbot.ingest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
